services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: house_power
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
      - mosquitto
    environment:
      DB_DSN: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/house_power
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      ASSUMED_VOLTS: ${ASSUMED_VOLTS:-120}
      ENABLE_NILM: ${ENABLE_NILM:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./dashboard:/app/dashboard:ro
      - ./nilm:/app/nilm:ro

volumes:
  pgdata:
